<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kloud Sport -- Tablero</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0B0D12;
    --card: #12151C;
    --border: #232838;
    --text: #F1F5F9;
    --muted: #8B95A8;
    --accent: #38BDF8;
    --green: #34D399;
    --amber: #F5A623;
    --red: #F87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  #gate {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
  }
  .gate-box { text-align: center; max-width: 280px; width: 100%; }
  .gate-box .wordmark { justify-content: center; display: flex; }
  #gate-input {
    margin-top: 24px;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    text-align: center;
  }
  #gate-input:focus { outline: none; border-color: var(--accent); }
  #gate-btn {
    margin-top: 12px;
    width: 100%;
    background: var(--accent);
    border: none;
    color: var(--bg);
    font-weight: 700;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    cursor: pointer;
  }
  #gate-error { display: none; color: var(--red); font-size: 13px; margin-top: 10px; }
  .layout { display: flex; min-height: 100vh; align-items: flex-start; }
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    padding: 24px 18px;
    border-right: 1px solid var(--border);
    position: sticky;
    top: 0;
  }
  .wordmark { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
  .wordmark span {
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.15em;
    font-size: 13px;
    margin-left: 5px;
  }
  .subtitle { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .sidebar nav { display: flex; flex-direction: column; gap: 2px; margin-top: 24px; }
  .sidebar nav a {
    display: block;
    padding: 9px 12px;
    border-radius: 8px;
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
  }
  .sidebar nav a:hover { color: var(--text); background: var(--card); }
  main { flex: 1; padding: 28px 32px; max-width: 1240px; }
  main section { margin-bottom: 32px; scroll-margin-top: 16px; }
  .two-col { display: flex; gap: 20px; align-items: flex-start; }
  .col-candidatos { flex: 3; min-width: 0; }
  .col-resumen { flex: 2; min-width: 0; }
  .chart-wrap { position: relative; height: 190px; }
  .chart-wrap canvas { width: 100% !important; height: 100% !important; }

  @media (max-width: 1080px) {
    .two-col { flex-direction: column; }
  }
  .balance-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
  }
  .balance-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .balance-card .label { font-size: 12px; color: var(--muted); }
  .balance-card .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .chart-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    margin-top: 14px;
  }
  .chart-title { font-size: 13px; font-weight: 600; margin-bottom: 12px; }
  .chart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px;
    margin-top: 14px;
  }
  .section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .candidato {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .candidato-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
  }
  .candidato-clickable { cursor: pointer; }
  .partido { font-size: 17px; font-weight: 700; }
  .chevron {
    display: inline-block;
    color: var(--muted);
    font-size: 18px;
    margin-left: 4px;
    transition: transform 0.15s;
  }
  .liga-fecha { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .veredicto { margin-top: 10px; font-size: 14px; }
  .veredicto .mercado { color: var(--accent); font-weight: 600; }
  .motivo { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .calc-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .calc-row label { font-size: 12px; color: var(--muted); }
  .calc-row input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    width: 90px;
    font-size: 14px;
    margin-top: 4px;
  }
  .calc-row input:focus { outline: none; border-color: var(--accent); }
  .resultado { font-size: 14px; margin-top: 10px; }
  .resultado .stake { font-weight: 700; color: var(--green); font-size: 16px; }
  .resultado.sin-valor { color: var(--amber); }
  .monto-positivo { color: var(--green); font-weight: 700; }
  .monto-negativo { color: var(--red); font-weight: 700; }
  .empty { color: var(--muted); font-size: 13px; }
  .calculada-badge {
    display: inline-block;
    margin-top: 8px;
    font-size: 11px;
    color: var(--amber);
    background: rgba(245, 166, 35, 0.12);
    padding: 3px 10px;
    border-radius: 20px;
  }
  .detalle {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .semaforo-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .resumen-text { font-size: 13.5px; margin: 4px 0 4px; line-height: 1.5; }
  .mini-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 16px 0 8px;
  }
  .mini-title:first-child { margin-top: 0; }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
    gap: 8px;
  }
  .stat-block { background: var(--bg); border-radius: 8px; padding: 8px 10px; text-align: center; }
  .stat-label { font-size: 10px; color: var(--muted); }
  .stat-value { font-size: 14px; font-weight: 700; margin-top: 3px; word-break: break-word; }
  .oportunidad-row, .alerta-row { font-size: 13px; padding: 3px 0; }

  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    .sidebar {
      width: 100%;
      border-right: none;
      border-bottom: 1px solid var(--border);
      padding: 16px 18px;
      position: static;
    }
    .sidebar nav { flex-direction: row; overflow-x: auto; margin-top: 14px; gap: 6px; }
    .sidebar nav a { white-space: nowrap; }
    main { padding: 20px 16px; max-width: 100%; }
  }
</style>
</head>

<div id="gate">
  <div class="gate-box">
    <div class="wordmark">KLOUD<span>SPORT</span></div>
    <input type="password" id="gate-input" placeholder="Contraseña" autofocus>
    <button id="gate-btn" onclick="checkPassword()">Entrar</button>
    <p id="gate-error">Contraseña incorrecta</p>
  </div>
</div>

<div id="content" style="display:none;">
<div class="layout">

      </div>

      <div class="col-resumen">

          <div class="balance-row" id="balance-row"></div>

          <div class="chart-card">
            <div class="chart-title">Evolución del capital</div>
            <div class="chart-wrap"><canvas id="chart-equity"></canvas></div>
          </div>

          <div class="chart-card">
            <div class="chart-title">Por mercado</div>
            <div class="chart-wrap"><canvas id="chart-mercado"></canvas></div>
          </div>

          <div class="chart-card">
            <div class="chart-title">Por liga</div>
            <div class="chart-wrap"><canvas id="chart-liga"></canvas></div>
          </div>
        </section>
      </div>
    </div>

    <section id="pendientes">
      <div class="section-title">Pendientes</div>
      <div id="pendientes-list"></div>
    </section>

    <section id="ganadas">
      <div class="section-title">Ganadas (últimas 15)</div>
      <div id="ganadas-list"></div>
    </section>

    <section id="perdidas">
      <div class="section-title">Perdidas (últimas 15)</div>
      <div id="perdidas-list"></div>
    </section>
  </main>
</div>
</div>

function fmt(n) {
  return Math.round(n).toLocaleString('es-AR');
}

async function sha256Hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
}

function unlockContent() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('content').style.display = '';
}

async function checkPassword() {
  const input = document.getElementById('gate-input').value;
  const hash = await sha256Hex(input);
  if (hash === PASSWORD_HASH) {
    localStorage.setItem(AUTH_KEY, '1');
    unlockContent();
  } else {
    document.getElementById('gate-error').style.display = 'block';
  }
}

document.getElementById('gate-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkPassword();
});

function calcularStake(prob, odds) {
  const p = prob / 100;
  const minOdds = 1 / p;
  const q = 1 - p;
  const b = odds - 1;
  const kellyPct = ((b * p) - q) / b;

  if (kellyPct <= 0) {
    const gapPct = ((minOdds - odds) / minOdds) * 100;
    return { valor: false, minOdds: minOdds.toFixed(2), gapPct: gapPct.toFixed(1) };
  }

  const rawStake  = KELLY.bankroll * kellyPct * KELLY.fraccion;
  const topeStake = KELLY.bankroll * KELLY.tope_pct;
  const stake     = Math.min(rawStake, topeStake);
  const retorno   = stake * odds;
  const ganancia  = retorno - stake;
  return { valor: true, stake: stake, retorno: retorno, ganancia: ganancia };
}

  return '<div class="stat-block"><div class="stat-label">' + label + '</div><div class="stat-value">' + value + '</div></div>';
}

function renderOportunidades(lista) {
  if (!lista.length) return '<div class="empty">Ninguna adicional</div>';
  return lista.map(function(op) {
    if (op.es_ah) {
      const pushStr = op.push ? ' (push ' + op.push + '%)' : '';
      return '<div class="oportunidad-row">📐 ' + op.tipo + ': ' + op.favorito + ' — ' + op.prob + '%' + pushStr + '</div>';
    }
    return '<div class="oportunidad-row">🔥 ' + op.tipo + ': ' + op.prob + '% de probabilidad</div>';
  }).join('');
}

function renderDetalle(c) {
  let html = '';

  if (c.es_parejo) {
    html += '<div class="mini-title">Oportunidades de valor</div>';
    html += renderOportunidades(c.oportunidades);
    return html;
  }

  let color = 'var(--amber)';
  if (c.semaforo.indexOf('VERDE') !== -1) color = 'var(--green)';
  else if (c.semaforo.indexOf('ROJO') !== -1) color = 'var(--red)';
  html += '<span class="semaforo-badge" style="background:' + color + '22;color:' + color + ';">' + c.semaforo + '</span>';
  html += '<p class="resumen-text">' + c.resumen + '</p>';

  html += '<div class="mini-title">Todas las oportunidades de valor</div>';
  html += renderOportunidades(c.oportunidades);

  html += '<div class="mini-title">Evaluacion general</div>';
  html += '<div class="stat-grid">';
  html += statBlock('Score', c.score + ' / 100');
  html += statBlock('Recomendacion', c.recomendacion);
  html += '</div>';

  html += '<div class="mini-title">Probabilidades</div>';
  html += '<div class="stat-grid">';
  html += statBlock('Local', c.prob_home + '%');
  html += statBlock('Empate', c.prob_draw + '%');
  html += statBlock('Visitante', c.prob_away + '%');
  html += '</div>';

  const comp = c.componentes;
  html += '<div class="mini-title">Componentes del analisis</div>';
  html += '<div class="stat-grid">';
  html += statBlock('Poisson', comp.poisson);
  html += statBlock('Forma', comp.forma);
  html += statBlock('Elo', comp.elo != null ? comp.elo : 'N/A');
  html += statBlock('H2H', comp.h2h);
  html += statBlock('Fuerza', comp.fuerza);
  html += statBlock('xG', comp.xg != null ? comp.xg : 'N/D');
  html += '</div>';

  if (c.motivacion) {
    html += '<div class="mini-title">Motivacion</div>';
    html += '<div class="stat-grid">';
    html += statBlock('Local', c.motivacion.local);
    html += statBlock('Visitante', c.motivacion.visitante);
    html += statBlock('Factor', c.motivacion.factor);
    html += '</div>';
  }

  if (c.h2h) {
    html += '<div class="mini-title">Historial H2H (' + c.h2h.total + ' partidos)</div>';
    html += '<div class="stat-grid">';
    html += statBlock(c.home_team + ' gano', c.h2h.home_wins);
    html += statBlock(c.away_team + ' gano', c.h2h.away_wins);
    html += statBlock('Empates', c.h2h.draws);
    html += '</div>';
  }

  if (c.alertas && c.alertas.length) {
    html += '<div class="mini-title">Alertas</div>';
    html += c.alertas.map(function(a) { return '<div class="alerta-row">' + a + '</div>'; }).join('');
  }

  return html;
}

function toggleDetalle(id) {
  const el = document.getElementById('detalle-' + id);
  if (!el) return;
  const chevron = document.getElementById('chevron-' + id);
  const abierto = el.style.display !== 'none';
  el.style.display = abierto ? 'none' : 'block';
  if (chevron) chevron.style.transform = abierto ? '' : 'rotate(90deg)';
}

function moverAPendientes(id, odds, stake) {
  // Solo visual, solo para esta sesion del navegador -- no se guarda en
  // ningun lado. El registro real sigue siendo el flujo de siempre
  // (jugar en Betsson, despues "python main.py results"). Esto es
  // nada mas que orden mientras recorres la lista de candidatos.
  const card = document.querySelector('[data-candidato-card="' + id + '"]');
  if (!card || card.dataset.movida === '1') return;
  card.dataset.movida = '1';

  const c = CANDIDATOS.find(function(x) { return x.id === id; });
  if (!c) return;

  const lista = document.getElementById('pendientes-list');
  const vacio = lista.querySelector('.empty');
  if (vacio) vacio.remove();

  const nuevoCard = document.createElement('div');
  nuevoCard.className = 'candidato';
  nuevoCard.innerHTML =
    '<div class="candidato-header">' +
      '<div class="partido">' + c.home_team + ' vs ' + c.away_team + '</div>' +
      '<div class="liga-fecha">' + c.liga + ' · ' + c.fecha + '</div>' +
    '</div>' +
    '<div class="veredicto"><span class="mercado">' + c.mercado_nombre + '</span> · cuota ' + odds + ' · stake $' + fmt(stake) + '</div>' +
    '<div class="calculada-badge">Recién calculada — falta registrarla</div>';
  lista.prepend(nuevoCard);

  card.style.transition = 'opacity 0.25s';
  card.style.opacity = '0';
  setTimeout(function() {
    card.remove();
    const candList = document.getElementById('candidatos-list');
    if (!candList.querySelector('.candidato')) {
      candList.innerHTML = '<div class="empty">No hay candidatos sin decidir.</div>';
    }
  }, 250);
}

function renderCandidatos() {
  const el = document.getElementById('candidatos-list');
  if (!CANDIDATOS.length) {
    el.innerHTML = '<div class="empty">No hay candidatos cargados. Corre el export de nuevo.</div>';
    return;
  }
  el.innerHTML = CANDIDATOS.map(function(c) {
    return '<div class="candidato" data-candidato-card="' + c.id + '">' +
      '<div class="candidato-header candidato-clickable" data-toggle-id="' + c.id + '">' +
        '<div class="partido">' + c.home_team + ' vs ' + c.away_team + ' <span class="chevron" id="chevron-' + c.id + '">›</span></div>' +
        '<div class="liga-fecha">' + c.liga + ' · ' + c.fecha + '</div>' +
      '</div>' +
      '<div class="veredicto"><span class="mercado">' + (c.mercado_nombre || 'Sin veredicto') + '</span> — ' + c.prob_elegida + '% del modelo</div>' +
      '<div class="motivo">' + c.motivo_veredicto + '</div>' +
      '<div class="calc-row">' +
        '<div><label>Cuota Betsson</label><br>' +
        '<input type="number" step="0.01" min="1.01" data-id="' + c.id + '" data-prob="' + c.prob_elegida + '" oninput="onCuotaChange(this)"></div>' +
        '<div class="resultado" id="resultado-' + c.id + '">Cuota minima para valor: ' + c.min_odds_required + '</div>' +
      '</div>' +
      '<div class="detalle" id="detalle-' + c.id + '" style="display:none;">' + renderDetalle(c) + '</div>' +
    '</div>';
  }).join('');

  document.querySelectorAll('[data-toggle-id]').forEach(function(header) {
    header.addEventListener('click', function() {
      toggleDetalle(header.getAttribute('data-toggle-id'));
    });
  });
}

function onCuotaChange(input) {
  const odds = parseFloat(input.value);
  const prob = parseFloat(input.dataset.prob);
  const id   = input.dataset.id;
  const box  = document.getElementById('resultado-' + id);

  if (!odds || odds <= 1) {
    box.className = 'resultado';
    box.textContent = '';
    return;
  }

  const r = calcularStake(prob, odds);
  if (!r.valor) {
    box.className = 'resultado sin-valor';
    box.innerHTML = 'Por debajo del umbral (' + r.minOdds + ') por ' + r.gapPct + '% — a tu criterio';
  } else {
    box.className = 'resultado';
    box.innerHTML = 'Stake sugerido: <span class="stake">$' + fmt(r.stake) + '</span> · ganancia potencial $' + fmt(r.ganancia);
    moverAPendientes(id, odds, r.stake);
  }
}

function renderResultados(elementId, lista, vacioTexto) {
  const el = document.getElementById(elementId);
  if (!lista.length) {
    el.innerHTML = '<div class="empty">' + vacioTexto + '</div>';
    return;
  }
  el.innerHTML = lista.map(function(r) {
    const hayMarcador = r.goles_home !== null && r.goles_home !== undefined;
    const marcador = hayMarcador ? ' (' + r.goles_home + '-' + r.goles_away + ')' : '';
    const montoClass = r.ganancia >= 0 ? 'monto-positivo' : 'monto-negativo';
    const montoTexto = (r.ganancia >= 0 ? '+' : '') + '$' + fmt(r.ganancia);
    return '<div class="candidato">' +
      '<div class="candidato-header">' +
        '<div class="partido">' + r.home_team + ' vs ' + r.away_team + marcador + '</div>' +
        '<div class="liga-fecha">' + r.liga + ' · ' + r.fecha_partido + '</div>' +
      '</div>' +
      '<div class="veredicto"><span class="mercado">' + r.mercado_nombre + '</span> · cuota ' + r.odds + ' · stake $' + fmt(r.stake) + '</div>' +
      '<div class="resultado"><span class="' + montoClass + '">' + montoTexto + '</span></div>' +
    '</div>';
  }).join('');
}

renderBalance();
renderCharts();
renderPendientes();
renderCandidatos();
renderResultados('ganadas-list', GANADAS, 'Todavia no hay apuestas ganadas.');
renderResultados('perdidas-list', PERDIDAS, 'Todavia no hay apuestas perdidas.');
</script>
